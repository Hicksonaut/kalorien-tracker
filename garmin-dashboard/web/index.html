<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training</title>
  <meta name="description" content="Persoenliches Garmin-Dashboard">
  <meta name="theme-color" content="#eef0f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07080c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <div class="app">
    <header class="topbar">
      <div>
        <h1 id="title">Heute</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <button class="sync-btn glass" id="sync" type="button" aria-label="Jetzt synchronisieren">
        <span class="dot" id="sync-dot"></span>
        <span id="sync-label">Sync</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>

  <nav class="tabbar glass" id="tabbar" aria-label="Bereiche">
    <a href="#/heute" data-tab="heute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      Heute
    </a>
    <a href="#/woche" data-tab="woche">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".6" fill="currentColor"/></svg>
      Woche
    </a>
    <a href="#/training/running" data-tab="training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="4.5" r="2"/><path d="M8 21l2.5-5.5 3 2.5v4"/><path d="M5.5 11.5l3-3 4.5.5 2.5 3.5 3 .8"/><path d="M10.5 15.5L13 9"/></svg>
      Training
    </a>
    <a href="#/health" data-tab="health">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/><path d="M4.5 12h3.5l1.5-2.5 2.5 5 1.5-2.5h6"/></svg>
      Health
    </a>
  </nav>

  <div class="sheet-bg" id="sheet-bg"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Aktivitaet"></section>
  <div class="tip" id="tip" role="status"></div>

  <script src="app.js" type="module"></script>
</body>
</html>
